<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0d0118">
    <link rel="icon" type="image/svg+xml" href="/KOSMOS/AppPrincipal/Frontend/pages/shared/favicon.svg">
    <title>Kosmos — Página não encontrada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --accent:#a541ff; --accent-lt:#c97cff;
            --text:#fff; --text-dim:#b8a8cc; --text-muted:#6a5880;
            --transition:.22s cubic-bezier(.4,0,.2,1);
        }
        html { overflow-x:hidden; overflow-x:clip; }
        body {
            font-family:'DM Sans', sans-serif;
            background:#000; color:var(--text);
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            padding:40px 24px; overflow-x:hidden; text-align:center;
        }

        /* Fundo animado */
        .bg { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
        .bg__orb { position:absolute; border-radius:50%; filter:blur(90px); }
        .bg__orb--1 { width:640px; height:640px; top:-180px; left:-120px; background:radial-gradient(circle,#6003a8 0%,transparent 70%); opacity:.5; animation:orbFloat 9s ease-in-out infinite; }
        .bg__orb--2 { width:460px; height:460px; bottom:-140px; right:-100px; background:radial-gradient(circle,#a541ff 0%,transparent 70%); opacity:.22; animation:orbDrift 11s ease-in-out infinite; }
        .bg__grid {
            position:absolute; inset:0;
            background-image:linear-gradient(rgba(165,65,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(165,65,255,.05) 1px,transparent 1px);
            background-size:48px 48px;
            -webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 45%,#000 40%,transparent 100%);
                    mask-image:radial-gradient(ellipse 80% 70% at 50% 45%,#000 40%,transparent 100%);
        }
        /* estrelinhas piscando */
        .star { position:absolute; color:var(--accent-lt); opacity:.7; animation:twinkle 3s ease-in-out infinite; }
        .star.s1 { top:16%; left:18%; font-size:14px; animation-delay:.2s; }
        .star.s2 { top:26%; right:20%; font-size:20px; animation-delay:1.1s; }
        .star.s3 { bottom:22%; left:24%; font-size:18px; animation-delay:.7s; }
        .star.s4 { bottom:16%; right:22%; font-size:13px; animation-delay:1.6s; }

        .wrap { position:relative; z-index:1; max-width:520px; display:flex; flex-direction:column; align-items:center; }

        /* Mascote */
        .mascote { width:150px; margin-bottom:6px; animation:flutua 4.5s ease-in-out infinite; }
        .mascote svg { width:100%; height:auto; display:block; }

        .erro404 {
            font-family:'Syne',sans-serif; font-weight:800;
            font-size:clamp(4.5rem, 16vw, 8rem); line-height:1;
            letter-spacing:-.03em; margin-bottom:6px;
            background:linear-gradient(120deg,#a541ff,#c97cff);
            -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
        }
        .tag {
            display:inline-flex; align-items:center; gap:8px;
            font-size:.76rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
            color:var(--accent-lt); background:rgba(165,65,255,.12);
            border:1px solid rgba(165,65,255,.3); padding:5px 16px; border-radius:100px;
            margin-bottom:20px;
        }
        h1 { font-family:'Syne',sans-serif; font-weight:700; font-size:clamp(1.4rem,4vw,2rem); margin-bottom:12px; }
        p { color:var(--text-dim); font-size:1.02rem; line-height:1.6; margin-bottom:32px; max-width:400px; }

        .actions { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
        .btn {
            display:inline-flex; align-items:center; gap:8px;
            font-family:'DM Sans',sans-serif; font-size:.97rem; font-weight:600;
            padding:13px 26px; border-radius:12px; text-decoration:none; cursor:pointer;
            border:none; transition:var(--transition);
        }
        .btn--primary { background:linear-gradient(120deg,#8200db,#a541ff); color:#fff; }
        .btn--primary:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(165,65,255,.4); }
        .btn--ghost { background:transparent; color:var(--accent-lt); border:1px solid rgba(165,65,255,.4); }
        .btn--ghost:hover { background:rgba(165,65,255,.1); border-color:var(--accent); }

        @keyframes flutua { 0%,100%{transform:translateY(0) rotate(-3deg);} 50%{transform:translateY(-12px) rotate(3deg);} }
        @keyframes orbFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-26px);} }
        @keyframes orbDrift { 0%,100%{transform:translate(0,0);} 50%{transform:translate(20px,-16px);} }
        @keyframes twinkle { 0%,100%{opacity:.25; transform:scale(.8);} 50%{opacity:.9; transform:scale(1.1);} }

        @media (prefers-reduced-motion: reduce) {
            .mascote, .bg__orb--1, .bg__orb--2, .star { animation:none !important; }
        }
        @media (max-width:480px) {
            .actions { flex-direction:column; width:100%; }
            .btn { justify-content:center; width:100%; }
            .mascote { width:120px; }
        }
    </style>
</head>
<body>

    <div class="bg">
        <div class="bg__orb bg__orb--1"></div>
        <div class="bg__orb bg__orb--2"></div>
        <div class="bg__grid"></div>
        <span class="star s1">✦</span>
        <span class="star s2">✦</span>
        <span class="star s3">✦</span>
        <span class="star s4">✦</span>
    </div>

    <div class="wrap">
        <!-- Mascote confuso -->
        <div class="mascote" aria-hidden="true">
            <svg viewBox="0 0 140 112">
                <defs>
                    <radialGradient id="corpo" cx="38%" cy="32%" r="80%">
                        <stop offset="0%" stop-color="#5b1a8f"/>
                        <stop offset="100%" stop-color="#2a0745"/>
                    </radialGradient>
                </defs>
                <path d="M12 58 A58 16 0 0 1 128 58" fill="none" stroke="rgba(165,65,255,.45)" stroke-width="4" stroke-linecap="round"/>
                <circle cx="70" cy="56" r="34" fill="url(#corpo)" stroke="rgba(165,65,255,.35)" stroke-width="1.5"/>
                <circle cx="50" cy="42" r="5" fill="rgba(255,255,255,.07)"/>
                <circle cx="90" cy="70" r="4" fill="rgba(255,255,255,.06)"/>
                <!-- olhos (um deles em espiral de tontura) -->
                <circle cx="59" cy="52" r="7.2" fill="#fff"/>
                <circle cx="59" cy="52" r="3.3" fill="#12011f"/>
                <circle cx="82" cy="52" r="7.2" fill="#fff"/>
                <circle cx="82" cy="52" r="3.3" fill="#12011f"/>
                <!-- boca confusa (ondinha) -->
                <path d="M62 69 Q66 66 70 69 Q74 72 78 69" fill="none" stroke="#c97cff" stroke-width="2.2" stroke-linecap="round"/>
                <path d="M12 58 A58 16 0 0 0 128 58" fill="none" stroke="#a541ff" stroke-width="4" stroke-linecap="round"/>
                <path d="M118 22 l2.2 4.6 4.8 .7 -3.5 3.4 .8 4.8 -4.3-2.3 -4.3 2.3 .8-4.8 -3.5-3.4 4.8-.7z" fill="#c97cff"/>
            </svg>
        </div>

        <div class="erro404">404</div>
        <span class="tag">Perdido no espaço</span>
        <h1>Esta página se perdeu na galáxia</h1>
        <p>O link que você seguiu pode estar quebrado ou a página foi movida para outra órbita.</p>

        <div class="actions">
            <a href="/KOSMOS/AppPrincipal/Frontend/pages/inicio/index.html" class="btn btn--primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 11l9-8 9 8M5 10v10h14V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Voltar ao início
            </a>
            <a href="/KOSMOS/AppPrincipal/Frontend/pages/login/index.html" class="btn btn--ghost">Fazer login</a>
        </div>
    </div>

</body>
</html>
