<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kosmos — Redefinir senha</title>
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="../shared/mouse-tracker.css">
    <link rel="stylesheet" href="../shared/cursor.css">
    <link rel="stylesheet" href="../shared/logo.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Background -->
    <div class="bg">
        <div class="bg__orb bg__orb--1"></div>
        <div class="bg__orb bg__orb--2"></div>
        <div class="bg__grid"></div>
    </div>

    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; position:relative; z-index:1;">
        <div class="form-card" style="max-width:420px; width:100%;">
            <div class="form-card__header">
                <a href="../inicio/index.html" class="logo">
                    <span class="logo__text klogo" role="img" aria-label="Kosmos">K<i class="klogo__o"></i>smos</span>
                </a>
                <h2 class="form-card__title" style="margin-top:18px;">Redefinir senha</h2>
                <p class="form-card__sub">Crie uma nova senha para a sua conta.</p>
            </div>

            <!-- Formulário -->
            <form class="form" id="formReset" novalidate>
                <div class="field">
                    <label class="field__label" for="senhaNova">Nova senha</label>
                    <div class="field__wrap">
                        <svg class="field__ico" viewBox="0 0 20 20" fill="none"><rect x="4" y="9" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M7 9V6a3 3 0 016 0v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                        <input id="senhaNova" type="password" class="field__input" placeholder="Mín. 8 caracteres" autocomplete="new-password">
                        <button type="button" class="field__toggle" aria-label="Mostrar senha" onclick="togglePwd(this)">
                            <svg viewBox="0 0 20 20" fill="none"><path d="M1.5 10S4 4.5 10 4.5 18.5 10 18.5 10 16 15.5 10 15.5 1.5 10 1.5 10z" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label class="field__label" for="senhaConfirma">Confirmar nova senha</label>
                    <div class="field__wrap">
                        <svg class="field__ico" viewBox="0 0 20 20" fill="none"><rect x="4" y="9" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M7 9V6a3 3 0 016 0v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                        <input id="senhaConfirma" type="password" class="field__input" placeholder="Repita a nova senha" autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    Redefinir senha
                    <svg viewBox="0 0 20 20" fill="none" width="18" height="18"><path d="M4 10h12M11 6l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </form>

            <div class="form-card__footer">
                <a href="index.html" class="form-card__back">
                    <svg viewBox="0 0 20 20" fill="none" width="15" height="15"><path d="M16 10H4M9 14l-5-4 5-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Voltar para o login
                </a>
            </div>
        </div>
    </div>

    <script>
        function togglePwd(btn) {
            const input = btn.closest('.field__wrap').querySelector('input');
            input.type = input.type === 'password' ? 'text' : 'password';
            btn.style.opacity = input.type === 'text' ? '1' : '0.5';
        }

        const token = new URLSearchParams(location.search).get('token') || '';
        const form  = document.getElementById('formReset');

        if (!token) {
            mostrarMsg('Link inválido. Solicite uma nova redefinição na tela de login.', 'erro');
            form.querySelector('button[type="submit"]').disabled = true;
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn      = this.querySelector('button[type="submit"]');
            const nova     = document.getElementById('senhaNova').value.trim();
            const confirma = document.getElementById('senhaConfirma').value.trim();
            document.querySelector('.msg-feedback')?.remove();

            if (nova !== confirma) { mostrarMsg('As senhas não coincidem.', 'erro'); return; }
            if (nova.length < 8)   { mostrarMsg('A senha deve ter no mínimo 8 caracteres.', 'erro'); return; }

            btn.disabled = true; btn.textContent = 'Aguarde...';
            try {
                const dados = new FormData();
                dados.append('token', token);
                dados.append('senha_nova', nova);
                const resp = await fetch('../../../Backend/php/senha_resetar.php', { method: 'POST', body: dados });
                const json = await resp.json();
                mostrarMsg(json.msg, json.ok ? 'sucesso' : 'erro');
                if (json.ok) {
                    form.reset();
                    form.style.display = 'none';
                    setTimeout(() => { window.location.href = 'index.html'; }, 1800);
                }
            } catch (err) {
                mostrarMsg('Não foi possível conectar ao servidor.', 'erro');
            } finally {
                btn.disabled = false; btn.textContent = 'Redefinir senha';
            }
        });

        function mostrarMsg(texto, tipo) {
            document.querySelector('.msg-feedback')?.remove();
            const div = document.createElement('div');
            div.className = 'msg-feedback';
            div.textContent = texto;
            div.style.cssText = 'margin-top:12px;padding:10px 14px;border-radius:8px;font-size:0.875rem;font-weight:500;background:' + (tipo==='sucesso'?'rgba(52,211,153,0.15)':'rgba(239,68,68,0.15)') + ';color:' + (tipo==='sucesso'?'#34d399':'#f87171') + ';border:1px solid ' + (tipo==='sucesso'?'#34d39940':'#f8717140');
            form.after(div);
        }
    </script>
    <script src="../shared/mouse-tracker.js"></script>
    <script src="../shared/cursor.js"></script>
</body>
</html>
