<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre na sua conta Kosmos para continuar organizando seus estudos.">
    <meta name="theme-color" content="#0d0118">
    <link rel="icon" type="image/svg+xml" href="../shared/favicon.svg">
    <title>Kosmos — Entrar</title>
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="../shared/mouse-tracker.css">
    <link rel="stylesheet" href="../shared/cursor.css">
    <link rel="stylesheet" href="../shared/logo.css">
    <link rel="stylesheet" href="../shared/mascote.css">
    <script src="../shared/mascote.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/cosmos.css">
</head>
<body>

    <!-- Background -->
    <!-- O céu. As regras estão em ../shared/cosmos.css e os dois arquivos que
         o animam são os mesmos da landing page e do dashboard. -->
    <canvas class="cosmos" id="cosmos" aria-hidden="true"></canvas>
    <div class="veu" aria-hidden="true"></div>

    <!-- Layout -->
    <div class="page">

        <!-- Form centralizado -->
        <div class="auth">
            <a href="../inicio/index.html" class="logo auth__logo">
                <span class="logo__text klogo" role="img" aria-label="Kosmos">K<i class="klogo__o"></i>smos</span>
            </a>
            <div class="form-shell">
            <div class="form-card">

                <!-- Mascote: planetinha formado. Desenhado por shared/mascote.js:
                     segue o cursor, pisca e tapa os olhos quando você digita a senha. -->
                <div class="mascote" id="mascote" data-mascote aria-hidden="true"></div>

                <div class="form-card__header">
                    <h1 class="form-card__title">Entre na sua conta</h1>
                    <p class="form-card__sub">Faça login para continuar seus estudos.</p>
                </div>

                <!-- Form -->
                <form class="form" novalidate>
                    <div class="field" id="fieldEmail">
                        <label class="field__label" for="email">E-mail</label>
                        <div class="field__wrap">
                            <svg class="field__ico" viewBox="0 0 20 20" fill="none"><path d="M2.5 5.5A1.5 1.5 0 014 4h12a1.5 1.5 0 011.5 1.5v9A1.5 1.5 0 0116 16H4a1.5 1.5 0 01-1.5-1.5v-9z" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 5.5l7.5 5.25L17.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                            <input id="email" type="email" class="field__input" placeholder="seu@email.com" autocomplete="email">
                            <svg class="field__check" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="currentColor" stroke-width="1.5" opacity=".4"/><path d="M6.5 10.4l2.4 2.4 4.6-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </div>
                    </div>

                    <div class="field" id="fieldSenha">
                        <div class="field__label-row">
                            <label class="field__label" for="senha">Senha</label>
                            <a href="#" class="field__link" id="linkEsqueci">Esqueceu a senha?</a>
                        </div>
                        <div class="field__wrap">
                            <svg class="field__ico" viewBox="0 0 20 20" fill="none"><rect x="4" y="9" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M7 9V6a3 3 0 016 0v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                            <input id="senha" type="password" class="field__input" placeholder="••••••••" autocomplete="current-password">
                            <button type="button" class="field__toggle" aria-label="Mostrar senha" onclick="togglePwd(this)">
                                <svg viewBox="0 0 20 20" fill="none" class="ico-eye-off" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9.5Q10 16.5 17.5 9.5"/><path d="M6 13.5 5 16M10 14.5 10 17M14 13.5 15 16"/></svg>
                                <svg viewBox="0 0 20 20" fill="none" class="ico-eye"><path d="M1.5 10S4 4.5 10 4.5 18.5 10 18.5 10 16 15.5 10 15.5 1.5 10 1.5 10z" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg>
                            </button>
                        </div>
                        <span class="field__caps" id="capsAviso" hidden>⇪ Caps Lock ativado</span>
                    </div>

                    <div class="divider"><span>ou</span></div>
                                    <!-- Google Identity Services -->
                                    <div id="g_id_onload"
                                         data-client_id="848162979346-58d2pq44nmhbrabsnhl6i1o1j2pnm7mu.apps.googleusercontent.com"
                                         data-callback="onGoogleLogin"
                                         data-auto_prompt="false"></div>
                                    <div class="google-btn-wrap">
                                        <button type="button" class="btn--google" onclick="googlePrompt()">
                                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                            </svg>
                                            Entrar com Google
                                        </button>
                                    </div>


                    <button type="submit" class="btn-submit">
                        Entrar na conta
                        <svg viewBox="0 0 20 20" fill="none" width="18" height="18"><path d="M4 10h12M11 6l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </form>

                <div class="form-card__footer">
                    <p class="form-card__signup">
                        Ainda não tem uma conta?
                        <a href="../cadastro/index.html" class="form-card__signup-link">Criar conta</a>
                    </p>
                    <a href="../inicio/index.html" class="form-card__back">
                        <svg viewBox="0 0 20 20" fill="none" width="15" height="15"><path d="M16 10H4M9 14l-5-4 5-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        Voltar para o início
                    </a>
                </div>
            </div>
            </div>
            <p class="auth__footer">© 2026 Kosmos. Todos os direitos reservados.</p>
        </div>

    </div>

    <!-- Modal: Esqueceu a senha -->
    <div class="kmodal" id="modalEsqueci">
        <div class="kmodal__box">
            <button class="kmodal__close" id="fecharEsqueci" aria-label="Fechar">&times;</button>
            <h3 class="kmodal__title">Esqueceu a senha?</h3>
            <p class="kmodal__sub">Informe seu e-mail e enviaremos um link para redefinir.</p>
            <form id="formEsqueci" novalidate>
                <input type="email" id="emailEsqueci" class="kmodal__input" placeholder="seu@email.com" autocomplete="email" required>
                <div class="kmodal__msg" id="msgEsqueci" hidden></div>
                <button type="submit" class="btn-submit" id="btnEsqueci">Enviar link</button>
            </form>
        </div>
    </div>

    <script>
        function togglePwd(btn) {
            const input = btn.closest('.field__wrap').querySelector('input');
            input.type = input.type === 'password' ? 'text' : 'password';
            btn.classList.toggle('ativo', input.type === 'text');
            btn.setAttribute('aria-label', input.type === 'text' ? 'Esconder senha' : 'Mostrar senha');
            input.focus();
        }

        document.querySelector('.form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn   = this.querySelector('button[type="submit"]');
            const btnHtml = btn.innerHTML;
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();
            document.querySelector('.msg-feedback')?.remove();
            const dados = new FormData();
            dados.append('email', email);
            dados.append('senha', senha);
            btn.disabled    = true;
            btn.textContent = 'Aguarde...';
            try {
                const resposta = await fetch('../../../Backend/php/login.php', {
                    method : 'POST',
                    body   : dados,
                });
                const json = await resposta.json();
                mostrarMsg(json.msg, json.ok ? 'sucesso' : 'erro');
                if (json.ok) {
                    sessionStorage.setItem('kosmos_usuario', json.nome);
                    sessionStorage.setItem('kosmos_intro', '1'); // dispara o splash no dashboard
                    setTimeout(() => { window.location.href = '../dashboard/index.php'; }, 1200);
                }
            } catch (err) {
                mostrarMsg('Nao foi possivel conectar ao servidor. Verifique se o XAMPP esta rodando.', 'erro');
            } finally {
                btn.disabled  = false;
                btn.innerHTML = btnHtml;
            }
        });

        function mostrarMsg(texto, tipo) {
            const div = document.createElement('div');
            div.className = 'msg-feedback msg-feedback--' + tipo;
            div.textContent = texto;
            div.style.cssText = 'margin-top:12px;padding:10px 14px;border-radius:8px;font-size:0.875rem;font-weight:500;background:' + (tipo==='sucesso'?'rgba(52,211,153,0.15)':'rgba(239,68,68,0.15)') + ';color:' + (tipo==='sucesso'?'#34d399':'#f87171') + ';border:1px solid ' + (tipo==='sucesso'?'#34d39940':'#f8717140');
            document.querySelector('.form').after(div);
        }

        /* --- Login com Google --- */
        function googlePrompt() {
            if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
                google.accounts.id.prompt();
            }
        }

        async function onGoogleLogin(response) {
            document.querySelector('.msg-feedback')?.remove();
            try {
                const dados = new FormData();
                dados.append('credential', response.credential);
                const resposta = await fetch('../../../Backend/php/login_google.php', { method: 'POST', body: dados });
                const json = await resposta.json();
                mostrarMsg(json.msg, json.ok ? 'sucesso' : 'erro');
                if (json.ok) {
                    sessionStorage.setItem('kosmos_usuario', json.nome);
                    sessionStorage.setItem('kosmos_intro', '1');
                    // Conta do Google ainda sem senha: cria a senha antes de entrar
                    const destino = json.precisa_senha
                        ? 'criar-senha.html'
                        : '../dashboard/index.php';
                    setTimeout(() => { window.location.href = destino; }, 1000);
                }
            } catch (err) {
                mostrarMsg('Não foi possível conectar ao servidor.', 'erro');
            }
        }

        /* --- Modal "Esqueceu a senha?" --- */
        const modalEsqueci = document.getElementById('modalEsqueci');
        document.getElementById('linkEsqueci').addEventListener('click', (e) => {
            e.preventDefault();
            modalEsqueci.classList.add('open');
        });
        document.getElementById('fecharEsqueci').addEventListener('click', () => modalEsqueci.classList.remove('open'));
        modalEsqueci.addEventListener('click', (e) => { if (e.target === modalEsqueci) modalEsqueci.classList.remove('open'); });

        document.getElementById('formEsqueci').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn   = document.getElementById('btnEsqueci');
            const email = document.getElementById('emailEsqueci').value.trim();
            const msgEl = document.getElementById('msgEsqueci');
            btn.disabled = true; btn.textContent = 'Enviando...';
            try {
                const dados = new FormData();
                dados.append('email', email);
                const resp = await fetch('../../../Backend/php/senha_esqueci.php', { method: 'POST', body: dados });
                const json = await resp.json();
                msgEl.hidden = false;
                msgEl.textContent = json.msg;
                msgEl.style.cssText = 'padding:9px 12px;border-radius:8px;font-size:.85rem;margin-bottom:12px;background:' + (json.ok ? 'rgba(52,211,153,.15)' : 'rgba(239,68,68,.15)') + ';color:' + (json.ok ? '#34d399' : '#f87171') + ';';
            } catch (err) {
                msgEl.hidden = false;
                msgEl.textContent = 'Não foi possível conectar ao servidor.';
                msgEl.style.cssText = 'padding:9px 12px;border-radius:8px;font-size:.85rem;margin-bottom:12px;background:rgba(239,68,68,.15);color:#f87171;';
            } finally {
                btn.disabled = false; btn.textContent = 'Enviar link';
            }
        });

        /* ═══ Interações visuais (não alteram a lógica do formulário) ═══ */

        /* --- Mascote: vive em shared/mascote.js (segue o cursor, pisca,
               tapa os olhos na senha e sorri com o e-mail válido) --- */

        /* --- Check visual de e-mail válido --- */
        (function () {
            const email = document.getElementById('email');
            const field = document.getElementById('fieldEmail');
            email.addEventListener('input', () => {
                field.classList.toggle('field--ok', email.value.trim() !== '' && email.checkValidity());
            });
        })();

        /* --- Aviso de Caps Lock na senha --- */
        (function () {
            const senha = document.getElementById('senha');
            const aviso = document.getElementById('capsAviso');
            function checa(e) {
                if (typeof e.getModifierState === 'function') {
                    aviso.hidden = !e.getModifierState('CapsLock');
                }
            }
            senha.addEventListener('keydown', checa);
            senha.addEventListener('keyup', checa);
            senha.addEventListener('blur', () => { aviso.hidden = true; });
        })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script src="../shared/mouse-tracker.js"></script>
    <script src="../shared/cursor.js"></script>
    <!-- O WebGL tenta primeiro; sem placa ou com shader que não compila,
         ele desiste em silêncio e o Canvas 2D assume. A ordem importa. -->
    <script src="../shared/cosmos-gl.js"></script>
    <script src="../shared/cosmos.js"></script>
</body>
</html>
