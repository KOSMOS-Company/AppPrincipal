<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kosmos — Criar senha</title>
    <link rel="icon" type="image/svg+xml" href="../shared/favicon.svg">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="../shared/mouse-tracker.css">
    <link rel="stylesheet" href="../shared/cursor.css">
    <link rel="stylesheet" href="../shared/logo.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
    <style>
        /* Medidor de força — mesmas regras do cadastro (cadastro.css),
           copiadas aqui para a página ficar autossuficiente. */
        .senha-extra { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
        .senha-barra {
            height: 5px;
            background: rgba(255,255,255,.07);
            border-radius: 100px;
            overflow: hidden;
        }
        .senha-barra__fill {
            display: block;
            height: 100%;
            width: 0%;
            border-radius: 100px;
            background: #f87171;
            transition: width .35s ease, background .35s ease;
        }
        .senha-reqs { display: flex; flex-wrap: wrap; gap: 6px; }
        .senha-req {
            font-size: .72rem;
            color: var(--text-muted);
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.09);
            padding: 3px 10px;
            border-radius: 100px;
        }
        .senha-req.ok {
            color: #34d399;
            background: rgba(52,211,153,.12);
            border-color: rgba(52,211,153,.3);
        }

        /* Aviso do topo: explica por que a tela apareceu */
        .aviso-google {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
            padding: 12px 14px;
            font-size: .86rem;
            line-height: 1.5;
            color: var(--text-dim, #b8a8cc);
            background: rgba(165,65,255,.08);
            border: 1px solid rgba(165,65,255,.22);
            border-radius: 12px;
        }
        .aviso-google svg { width: 18px; height: 18px; flex: 0 0 auto; margin-top: 1px; color: #a541ff; }

        .acao-sair {
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            font-size: .85rem;
            color: var(--text-muted, #7a6890);
            cursor: pointer;
            transition: color .25s ease;
        }
        .acao-sair:hover { color: #fff; }
    </style>
</head>
<body>

    <!-- Background -->
    <div class="bg">
        <div class="bg__orb bg__orb--1"></div>
        <div class="bg__orb bg__orb--2"></div>
        <div class="bg__grid"></div>
    </div>

    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; position:relative; z-index:1;">
        <div class="form-card" style="max-width:440px; width:100%;">
            <div class="form-card__header">
                <a href="../inicio/index.html" class="logo">
                    <span class="logo__text klogo" role="img" aria-label="Kosmos">K<i class="klogo__o"></i>smos</span>
                </a>
                <h2 class="form-card__title" style="margin-top:18px;">Crie sua senha</h2>
                <p class="form-card__sub" id="saudacao">Falta só um passo para terminar sua conta.</p>
            </div>

            <p class="aviso-google">
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 6.5v.5M10 9.5v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                <span>Você entrou com o Google, então sua conta ainda não tem senha.
                Defina uma agora para conseguir entrar também com e-mail e senha.</span>
            </p>

            <!-- Formulário -->
            <form class="form" id="formCriar" novalidate>
                <div class="field">
                    <label class="field__label" for="senhaNova">Senha</label>
                    <div class="field__wrap">
                        <svg class="field__ico" viewBox="0 0 20 20" fill="none"><rect x="4" y="9" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M7 9V6a3 3 0 016 0v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                        <input id="senhaNova" type="password" class="field__input" placeholder="Mín. 8 caracteres" autocomplete="new-password">
                        <button type="button" class="field__toggle" aria-label="Mostrar senha" onclick="togglePwd(this)">
                            <svg viewBox="0 0 20 20" fill="none"><path d="M1.5 10S4 4.5 10 4.5 18.5 10 18.5 10 16 15.5 10 15.5 1.5 10 1.5 10z" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg>
                        </button>
                    </div>

                    <!-- Medidor de força (aparece ao digitar) -->
                    <div class="senha-extra" id="senhaExtra" hidden>
                        <div class="senha-barra"><span class="senha-barra__fill" id="senhaBarraFill"></span></div>
                        <div class="senha-reqs">
                            <span class="senha-req" id="reqLen">8+ caracteres</span>
                            <span class="senha-req" id="reqLetra">letras</span>
                            <span class="senha-req" id="reqNum">números</span>
                        </div>
                    </div>
                </div>

                <div class="field">
                    <label class="field__label" for="senhaConfirma">Confirmar senha</label>
                    <div class="field__wrap">
                        <svg class="field__ico" viewBox="0 0 20 20" fill="none"><rect x="4" y="9" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M7 9V6a3 3 0 016 0v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                        <input id="senhaConfirma" type="password" class="field__input" placeholder="Repita a senha" autocomplete="new-password">
                        <button type="button" class="field__toggle" aria-label="Mostrar senha" onclick="togglePwd(this)">
                            <svg viewBox="0 0 20 20" fill="none"><path d="M1.5 10S4 4.5 10 4.5 18.5 10 18.5 10 16 15.5 10 15.5 1.5 10 1.5 10z" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnSalvar">
                    Salvar e continuar
                    <svg viewBox="0 0 20 20" fill="none" width="18" height="18"><path d="M4 10h12M11 6l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </form>

            <div class="form-card__footer">
                <button type="button" class="acao-sair" id="btnSair">Sair e entrar com outra conta</button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND = '../../../Backend/php';
        const form = document.getElementById('formCriar');

        function togglePwd(btn) {
            const input = btn.closest('.field__wrap').querySelector('input');
            input.type = input.type === 'password' ? 'text' : 'password';
            btn.style.opacity = input.type === 'text' ? '1' : '0.5';
        }

        /* Esta tela só faz sentido para quem está logado E ainda não tem
           senha. Sem sessão volta para o login; com senha já criada segue
           direto para o dashboard. */
        (async function conferirConta() {
            try {
                const resp = await fetch(`${BACKEND}/conta_dados.php`);

                if (resp.status === 401) {
                    window.location.replace('index.html');
                    return;
                }

                const json = await resp.json();

                if (json.ok && json.tem_senha) {
                    window.location.replace('../dashboard/index.php');
                    return;
                }

                if (json.ok && json.nome) {
                    const primeiro = json.nome.trim().split(' ')[0];
                    document.getElementById('saudacao').textContent =
                        `Falta só um passo, ${primeiro}.`;
                }
            } catch (err) {
                mostrarMsg('Não foi possível falar com o servidor. Tente recarregar a página.', 'erro');
            }
        })();

        /* Medidor de força (mesma regra do cadastro) */
        (function medidor() {
            const senha  = document.getElementById('senhaNova');
            const extra  = document.getElementById('senhaExtra');
            const barra  = document.getElementById('senhaBarraFill');
            const reqLen = document.getElementById('reqLen');
            const reqLet = document.getElementById('reqLetra');
            const reqNum = document.getElementById('reqNum');

            senha.addEventListener('input', () => {
                const v = senha.value;
                extra.hidden = v.length === 0;

                const temLen   = v.length >= 8;
                const temLetra = /[a-zA-ZÀ-ÿ]/.test(v);
                const temNum   = /[0-9]/.test(v);
                reqLen.classList.toggle('ok', temLen);
                reqLet.classList.toggle('ok', temLetra);
                reqNum.classList.toggle('ok', temNum);

                const pontos = [temLen, temLetra, temNum].filter(Boolean).length;
                const cores  = ['#f87171', '#f87171', '#fbbf24', '#34d399'];
                barra.style.width = (pontos / 3) * 100 + '%';
                barra.style.background = cores[pontos];
            });
        })();

        /* Salva a senha (o backend grava o hash em usuarios.senha_hash) */
        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const btn      = document.getElementById('btnSalvar');
            const nova     = document.getElementById('senhaNova').value.trim();
            const confirma = document.getElementById('senhaConfirma').value.trim();
            document.querySelector('.msg-feedback')?.remove();

            if (nova.length < 8)   { mostrarMsg('A senha deve ter no mínimo 8 caracteres.', 'erro'); return; }
            if (nova !== confirma) { mostrarMsg('As senhas não coincidem.', 'erro'); return; }

            btn.disabled = true;
            const textoBtn = btn.innerHTML;
            btn.textContent = 'Salvando...';

            try {
                const dados = new FormData();
                dados.append('senha_nova', nova);
                // conta_senha.php cria a senha sem pedir a atual quando a
                // conta ainda não tem uma (decisão feita no backend).
                const resp = await fetch(`${BACKEND}/conta_senha.php`, { method: 'POST', body: dados });
                const json = await resp.json();

                mostrarMsg(json.msg, json.ok ? 'sucesso' : 'erro');

                if (json.ok) {
                    form.style.display = 'none';
                    setTimeout(() => { window.location.replace('../dashboard/index.php'); }, 1400);
                    return;
                }
            } catch (err) {
                mostrarMsg('Não foi possível conectar ao servidor.', 'erro');
            }

            btn.disabled = false;
            btn.innerHTML = textoBtn;
        });

        /* Sair sem criar senha (evita ficar preso nesta tela) */
        document.getElementById('btnSair').addEventListener('click', async () => {
            try {
                await fetch(`${BACKEND}/logout.php`);
            } catch (err) {
                /* mesmo se falhar, volta para o login */
            }
            sessionStorage.removeItem('kosmos_usuario');
            sessionStorage.removeItem('kosmos_intro');
            window.location.replace('index.html');
        });

        function mostrarMsg(texto, tipo) {
            document.querySelector('.msg-feedback')?.remove();
            const div = document.createElement('div');
            div.className = 'msg-feedback';
            div.textContent = texto;
            div.style.cssText = 'margin-top:12px;padding:10px 14px;border-radius:8px;font-size:0.875rem;font-weight:500;background:' + (tipo==='sucesso'?'rgba(52,211,153,0.15)':'rgba(239,68,68,0.15)') + ';color:' + (tipo==='sucesso'?'#34d399':'#f87171') + ';border:1px solid ' + (tipo==='sucesso'?'#34d39940':'#f8717140');
            form.after(div);
        }
    </script>
    <script src="../shared/mouse-tracker.js"></script>
    <script src="../shared/cursor.js"></script>
</body>
</html>
