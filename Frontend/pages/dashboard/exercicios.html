<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kosmos — Exercícios</title>
    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="stylesheet" href="./css/exercicios.css">
    <link rel="stylesheet" href="./css/cursor.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="bg">
        <div class="bg__orb bg__orb--1"></div>
        <div class="bg__orb bg__orb--2"></div>
        <div class="bg__grid"></div>
    </div>

    <div class="contGeral">

        <aside class="contLateral">
            <div class="contLogo">
                <a href="../inicio/index.html" class="logo__text">Kosmos</a>
            </div>
            <nav class="botoesL">
                <a href="index.html">
                    <svg viewBox="0 0 24 24" fill="none" class="nav-icon"><path d="M4 10 L12 4 L20 10 L20 20 L4 20 Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Início
                </a>
                <a href="resumos.html">
                    <svg viewBox="0 0 24 24" fill="none" class="nav-icon"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8 10 H16 M8 14 H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    Resumos
                </a>
                <a href="flashcards.html">
                    <svg viewBox="0 0 24 24" fill="none" class="nav-icon"><rect x="3" y="6" width="13" height="12" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 4 H19 a2 2 0 0 1 2 2 V16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    Flashcards
                </a>
                <a href="exercicios.html">
                    <svg viewBox="0 0 24 24" fill="none" class="nav-icon"><path d="M4 6 H20 M4 12 H20 M4 18 H14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    Exercícios
                </a>
                <a href="pomodoro.html">
                    <svg viewBox="0 0 24 24" fill="none" class="nav-icon"><circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="2"/><path d="M12 9 L12 13 L15 15 M9 3 H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Pomodoro
                </a>
                <a href="conta.html">
                    <svg viewBox="0 0 24 24" fill="none" class="nav-icon"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    Conta
                </a>
            </nav>
            <div class="contSequencia">
                <div class="linhaCima">Sequência</div>
                <div class="linhaBaixo">6 dias</div>
                <progress id="sequencia" value="70" max="100"></progress>
            </div>
        </aside>

        <main class="contMeio">
            <header class="contCabeca">
                <div class="contCabeca__texto">
                    <h1>Exercícios com <span class="h-nome">IA</span></h1>
                    <p>Gere questões personalizadas e teste seu conhecimento.</p>
                </div>
            </header>

            <!-- Gerador -->
            <div class="painel gerador">
                <div class="gerador__campos">
                    <div class="campo">
                        <label for="gMateria">Matéria</label>
                        <select id="gMateria">
                            <option value="Matemática">Matemática</option>
                            <option value="Física">Física</option>
                            <option value="Biologia">Biologia</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="gDificuldade">Dificuldade</label>
                        <select id="gDificuldade">
                            <option value="Fácil">Fácil</option>
                            <option value="Médio" selected>Médio</option>
                            <option value="Difícil">Difícil</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="gQtd">Quantidade</label>
                        <select id="gQtd">
                            <option value="3">3 questões</option>
                            <option value="5">5 questões</option>
                        </select>
                    </div>
                </div>
                <button class="dash-btn dash-btn--primary" id="btnGerar">
                    <svg viewBox="0 0 20 20" fill="none"><path d="M10 2l1.8 4.4L16 8l-4.2 1.6L10 14l-1.8-4.4L4 8l4.2-1.6L10 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
                    Gerar exercícios
                </button>
            </div>

            <!-- Resultado -->
            <div id="questoes" class="questoes"></div>

            <div class="vazio" id="vazioEx">
                <svg viewBox="0 0 24 24" fill="none"><path d="M9 11l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/></svg>
                <h3>Pronto para praticar?</h3>
                <p>Escolha a matéria e a dificuldade, depois clique em "Gerar exercícios".</p>
            </div>

            <!-- Ações finais -->
            <div class="ex-rodape" id="exRodape" hidden>
                <div class="ex-placar" id="placar" hidden></div>
                <button class="dash-btn dash-btn--primary" id="btnCorrigir">Corrigir respostas</button>
            </div>
        </main>
    </div>

    <script src="./js/dashboard.js"></script>
    <script src="./js/exercicios.js"></script>
    <script src="./js/cursor.js"></script>
</body>
</html>
